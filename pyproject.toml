[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wfstat"
# Single source of truth is wfstat.__version__ — the file has to carry its own
# version anyway, since dropping it bare on $PATH is a supported install.
dynamic = ["version"]
description = "Visibility into Claude Code Workflow runs — token accounting, live agent status, per-agent transcripts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Kezia Cousins" }]
keywords = ["claude", "claude-code", "workflow", "observability", "tokens", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/keziacousins/wfstat"
Issues = "https://github.com/keziacousins/wfstat/issues"

[project.scripts]
wfstat = "wfstat:main"

[tool.setuptools]
py-modules = ["wfstat"]

[tool.setuptools.dynamic]
version = { attr = "wfstat.__version__" }
