name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The tool reads a filesystem layout and formats terminal output, so it is
    # worth proving on both OSes people actually run Claude Code on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover tests -v

  package:
    # Catches the failure mode the test job cannot see: a pyproject that builds
    # but whose console script does not resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install from source
        run: pip install .

      - name: Console script resolves
        run: wfstat --version

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

  version:
    # A tag *is* the release here — `pipx install git+…@v1.1.0` resolves to it,
    # and tags are the one thing you cannot quietly fix after the fact. So the
    # tag and the code must agree before the release is allowed to stand.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import wfstat; print(wfstat.__version__)')"
          echo "tag=$tag  __version__=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $code"
            exit 1
          fi

      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
