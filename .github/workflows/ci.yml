name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The tool reads a filesystem layout and formats terminal output, so it is
    # worth proving on both OSes people actually run Claude Code on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover tests -v

  package:
    # Catches the failure mode the test job cannot see: a pyproject that builds
    # but whose console script does not resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from source
        run: pip install .

      - name: Console script resolves
        run: wfstat --version

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
